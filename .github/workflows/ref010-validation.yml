name: REF-010 importer validation

on:
  push:
    branches:
      - validation/ref010-importer
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4

      - name: Materialize validation harness
        shell: bash
        run: |
          set -euo pipefail
          cat ref010-harness.b64.part* | base64 --decode > /tmp/ref010-validation-harness.tar.gz
          echo "b647d97698f9ba1ebe51c7ef6305b9071e2c79464fcd8030b0aa51da7b6ea6e0  /tmp/ref010-validation-harness.tar.gz" | sha256sum --check
          tar -xzf /tmp/ref010-validation-harness.tar.gz -C .
          test -f Cargo.toml
          test -f tests/ref010_import.rs

      - name: Install Rust validation components
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default stable
          mkdir -p validation
          rustc --version | tee validation/rust-version.txt
          cargo --version | tee validation/cargo-version.txt
          rustfmt --version | tee validation/rustfmt-version.txt
          cargo clippy --version | tee validation/clippy-version.txt

      - name: Format and verify source
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check 2>&1 | tee validation/cargo-fmt.log

      - name: Run importer tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --all-targets --verbose 2>&1 | tee validation/cargo-test.log

      - name: Run Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --all-targets --all-features -- -D warnings 2>&1 | tee validation/cargo-clippy.log

      - name: Exercise reduced source-shaped fixture
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet --bin ref010-inspect -- \
            --xml tests/fixtures/siso_ref_010_v35_excerpt.xml \
            --entity-type 1.1.225.1.1.3.0 \
            --show-diagnostics \
            2>&1 | tee validation/reduced-fixture-inspect.log

      - name: Download and inspect full public v35 XML mirror
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/TNO-MST/siso-entity-type/main/packages/parser/data/SISO-REF-010.xml \
            --output validation/SISO-REF-010-v35.xml
          sha256sum validation/SISO-REF-010-v35.xml | tee validation/full-v35.sha256
          wc -c validation/SISO-REF-010-v35.xml | tee validation/full-v35.bytes
          cargo run --quiet --bin ref010-inspect -- \
            --xml validation/SISO-REF-010-v35.xml \
            --entity-type 1.1.225.1.1.3.0 \
            --show-diagnostics \
            2>&1 | tee validation/full-v35-inspect.log

      - name: Package formatted harness
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation
          tar --exclude=target --exclude=validation --exclude='ref010-harness.b64.part*' \
            -czf validation/formatted-harness.tar.gz \
            Cargo.toml README.md src tests
          sha256sum validation/formatted-harness.tar.gz > validation/formatted-harness.sha256

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ref010-validation-evidence
          path: validation/
          if-no-files-found: error
          retention-days: 30
