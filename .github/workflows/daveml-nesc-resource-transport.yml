name: DAVE-ML NESC resource transport

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out transport branch
        uses: actions/checkout@v4

      - name: Collect pinned NASA/NESC and DAVE-ML resources
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/taoryx-daveml-nesc-resources-v1.0"
          mkdir -p \
            "$ROOT/raw/daveml/examples" \
            "$ROOT/raw/daveml/schema" \
            "$ROOT/raw/nesc/pinned-simupy-flight" \
            "$ROOT/raw/nesc/official" \
            "$ROOT/reference"

          SIMUPY_SHA='70754e6916afc206e8c0abb386d1a9c98bf8f561'
          curl --fail --location --retry 4 --retry-all-errors --max-time 900 \
            "https://codeload.github.com/nasa/simupy-flight/zip/$SIMUPY_SHA" \
            --output "$RUNNER_TEMP/simupy-flight.zip"
          unzip -q "$RUNNER_TEMP/simupy-flight.zip" -d "$RUNNER_TEMP/simupy-flight"
          SRC="$RUNNER_TEMP/simupy-flight/simupy-flight-$SIMUPY_SHA"
          cp -R "$SRC/NESC_data" "$ROOT/raw/nesc/pinned-simupy-flight/"
          cp -R "$SRC/nesc_test_cases" "$ROOT/raw/nesc/pinned-simupy-flight/"
          cp "$SRC/README.rst" "$ROOT/raw/nesc/pinned-simupy-flight/README.rst"
          cp "$SRC/license.pdf" "$ROOT/raw/nesc/pinned-simupy-flight/NASA-OSA-1.3-license.pdf"
          find "$ROOT/raw/nesc/pinned-simupy-flight" -type d -name '__pycache__' -prune -exec rm -rf '{}' + || true

          if [[ -d "$SRC/NESC_data/All_models" ]]; then
            (cd "$SRC/NESC_data" && zip -qr "$ROOT/raw/nesc/official/All_models.zip" All_models)
          fi
          if [[ -d "$SRC/NESC_data/Atmospheric_checkcases" ]]; then
            (cd "$SRC/NESC_data" && zip -qr "$ROOT/raw/nesc/official/Atmospheric_checkcases.zip" Atmospheric_checkcases)
          fi
          if [[ -d "$SRC/NESC_data/Orbital_checkcases" ]]; then
            (cd "$SRC/NESC_data" && zip -qr "$ROOT/raw/nesc/official/Orbital_checkcases.zip" Orbital_checkcases)
          fi
          INITIAL="$(find "$SRC/NESC_data" -maxdepth 3 -type f -iname '*initial*condition*.xlsx' | head -n 1 || true)"
          [[ -n "$INITIAL" ]] && cp "$INITIAL" "$ROOT/raw/nesc/official/Initial_Conditions.xlsx"

          fetch_optional() {
            local url="$1"
            local out="$2"
            if curl --fail --location --retry 2 --retry-all-errors --max-time 120 \
              --user-agent 'Taoryx resource catalog builder' "$url" --output "$out"; then
              printf 'ok\t%s\t%s\n' "$url" "${out#$ROOT/}" >> "$ROOT/reference/download-status.tsv"
            else
              rm -f "$out"
              printf 'unavailable\t%s\t%s\n' "$url" "${out#$ROOT/}" >> "$ROOT/reference/download-status.tsv"
            fi
          }
          printf 'status\turl\tpath\n' > "$ROOT/reference/download-status.tsv"

          F16="$(find "$SRC/NESC_data/All_models" -type f -iname 'F16_aero.dml' | head -n 1 || true)"
          [[ -n "$F16" ]] && cp "$F16" "$ROOT/raw/daveml/examples/F16_aero.dml"
          ATMOS="$(find "$SRC" -type f -iname 'atmos_76.dml' | head -n 1 || true)"
          [[ -n "$ATMOS" ]] && cp "$ATMOS" "$ROOT/raw/daveml/examples/atmos_76.dml"

          fetch_optional 'https://raw.githubusercontent.com/DyadLang/DyadDemos/9e10c296a173403bdfc993ac626759b6e6f77b2e/HL20Demo/assets/shared/HL20_aero.dml' \
            "$ROOT/raw/daveml/examples/HL20_aero.dml"
          fetch_optional 'https://raw.githubusercontent.com/DyadLang/DyadDemos/9e10c296a173403bdfc993ac626759b6e6f77b2e/HL20Demo/assets/shared/atmos_76.dml' \
            "$ROOT/raw/daveml/examples/atmos_76.dml"
          fetch_optional 'http://daveml.org/examples/simple_aero.dml' \
            "$ROOT/raw/daveml/examples/simple_aero.dml"
          fetch_optional 'http://daveml.org/examples/twoD_table.dml' \
            "$ROOT/raw/daveml/examples/twoD_table.dml"
          fetch_optional 'http://daveml.org/examples/twoD_ungridded.dml' \
            "$ROOT/raw/daveml/examples/twoD_ungridded.dml"
          fetch_optional 'http://daveml.org/examples/threeD_ungridded.dml' \
            "$ROOT/raw/daveml/examples/threeD_ungridded.dml"
          fetch_optional 'https://www.daveml.org/DTDs/2p0/DAVEfunc.dtd' \
            "$ROOT/raw/daveml/schema/DAVEfunc-2.0-family.dtd"
          fetch_optional 'https://www.daveml.org/DTDs/2p0p2/DAVEfunc.dtd' \
            "$ROOT/raw/daveml/schema/DAVEfunc-2.0.2.dtd"

          cat > "$ROOT/reference/SOURCES.md" <<'EOF'
          # Sources

          - NASA/NESC official site: https://nescacademy.nasa.gov/flightsim/2015
          - Pinned NASA mirror: https://github.com/nasa/simupy-flight
          - Pinned commit: 70754e6916afc206e8c0abb386d1a9c98bf8f561
          - DAVE-ML examples: https://www.daveml.org/examples/index.html

          The bundle retains the complete `NESC_data` and `nesc_test_cases` trees
          from the pinned NASA repository. ZIP views are generated from those exact
          mirrored member bytes. The direct DAVE-ML example files are retained when
          available from their official or pinned public mirrors.
          EOF

          python - "$ROOT" <<'PY'
          from __future__ import annotations
          import csv
          import hashlib
          import sys
          from pathlib import Path
          from zipfile import ZipFile

          root = Path(sys.argv[1])
          zip_rows = []
          for archive in sorted((root / 'raw/nesc/official').glob('*.zip')):
              with ZipFile(archive) as zf:
                  bad = zf.testzip()
                  if bad is not None:
                      raise SystemExit(f'Bad ZIP member {bad!r} in {archive}')
                  zip_rows.append((archive.relative_to(root).as_posix(), len(zf.infolist()), archive.stat().st_size))
          with (root / 'reference/zip-summary.tsv').open('w', encoding='utf-8', newline='') as fh:
              writer = csv.writer(fh, delimiter='\t')
              writer.writerow(['path', 'member_count', 'size_bytes'])
              writer.writerows(zip_rows)

          rows = []
          for path in sorted(p for p in root.rglob('*') if p.is_file()):
              rel = path.relative_to(root).as_posix()
              rows.append((rel, path.stat().st_size, hashlib.sha256(path.read_bytes()).hexdigest()))
          with (root / 'reference/resource-files.tsv').open('w', encoding='utf-8', newline='') as fh:
              writer = csv.writer(fh, delimiter='\t')
              writer.writerow(['path', 'size_bytes', 'sha256'])
              writer.writerows(rows)
          with (root / 'checksums.sha256').open('w', encoding='utf-8') as fh:
              for rel, _, digest in rows:
                  if rel != 'checksums.sha256':
                      fh.write(f'{digest}  {rel}\n')
          PY

          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Upload resource artifact
        uses: actions/upload-artifact@v4
        with:
          name: taoryx-daveml-nesc-resources-v1.0
          path: ${{ env.ROOT }}
          if-no-files-found: error
          compression-level: 6
          retention-days: 1
