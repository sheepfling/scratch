name: DAVE-ML NESC resource transport

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out transport branch
        uses: actions/checkout@v4

      - name: Collect official DAVE-ML and NASA/NESC resources
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$RUNNER_TEMP/taoryx-daveml-nesc-resources-v1.0"
          STATUS="$ROOT/reference/download-status.tsv"
          ERRORS=0
          mkdir -p \
            "$ROOT/raw/daveml/examples" \
            "$ROOT/raw/daveml/schema" \
            "$ROOT/raw/nesc/official" \
            "$ROOT/raw/nesc/pinned-simupy-flight" \
            "$ROOT/reference"
          printf 'status\turl\tpath\n' > "$STATUS"

          fetch_required() {
            local url="$1"
            local out="$2"
            echo "Downloading $url"
            if curl --fail --location --retry 6 --retry-all-errors --connect-timeout 30 \
              --user-agent 'Taoryx resource catalog builder' \
              "$url" --output "$out"; then
              printf 'ok\t%s\t%s\n' "$url" "${out#$ROOT/}" >> "$STATUS"
            else
              printf 'failed\t%s\t%s\n' "$url" "${out#$ROOT/}" >> "$STATUS"
              rm -f "$out"
              ERRORS=$((ERRORS + 1))
            fi
          }

          fetch_optional() {
            local url="$1"
            local out="$2"
            echo "Downloading optional $url"
            if curl --fail --location --retry 3 --retry-all-errors --connect-timeout 30 \
              --user-agent 'Taoryx resource catalog builder' \
              "$url" --output "$out"; then
              printf 'ok-optional\t%s\t%s\n' "$url" "${out#$ROOT/}" >> "$STATUS"
            else
              printf 'failed-optional\t%s\t%s\n' "$url" "${out#$ROOT/}" >> "$STATUS"
              rm -f "$out"
            fi
          }

          fetch_required 'https://nescacademy.nasa.gov/src/flightsim/Models/All_models.zip' \
            "$ROOT/raw/nesc/official/All_models.zip"
          fetch_required 'https://nescacademy.nasa.gov/src/flightsim/Scenarios/Initial_Conditions.xlsx' \
            "$ROOT/raw/nesc/official/Initial_Conditions.xlsx"
          fetch_required 'https://nescacademy.nasa.gov/src/flightsim/Datasets/Atmospheric_checkcases.zip' \
            "$ROOT/raw/nesc/official/Atmospheric_checkcases.zip"
          fetch_required 'https://nescacademy.nasa.gov/src/flightsim/Datasets/Orbital_checkcases.zip' \
            "$ROOT/raw/nesc/official/Orbital_checkcases.zip"
          fetch_optional 'https://nescacademy.nasa.gov/flightsim/2015' \
            "$ROOT/raw/nesc/official/NESC-2015-index.html"

          fetch_optional 'https://www.daveml.org/examples/index.html' \
            "$ROOT/raw/daveml/examples/index.html"
          fetch_required 'https://www.daveml.org/examples/simple_aero.dml' \
            "$ROOT/raw/daveml/examples/simple_aero.dml"
          fetch_required 'https://www.daveml.org/examples/twoD_table.dml' \
            "$ROOT/raw/daveml/examples/twoD_table.dml"
          fetch_required 'https://www.daveml.org/examples/twoD_ungridded.dml' \
            "$ROOT/raw/daveml/examples/twoD_ungridded.dml"
          fetch_required 'https://www.daveml.org/examples/threeD_ungridded.dml' \
            "$ROOT/raw/daveml/examples/threeD_ungridded.dml"
          fetch_required 'https://www.daveml.org/examples/atmos_76.dml' \
            "$ROOT/raw/daveml/examples/atmos_76.dml"
          fetch_required 'https://www.daveml.org/examples/F16_aero.dml' \
            "$ROOT/raw/daveml/examples/F16_aero.dml"
          fetch_required 'https://www.daveml.org/examples/HL20_aero.dml.gz' \
            "$ROOT/raw/daveml/examples/HL20_aero.dml.gz"
          if [[ -f "$ROOT/raw/daveml/examples/HL20_aero.dml.gz" ]]; then
            gzip -dc "$ROOT/raw/daveml/examples/HL20_aero.dml.gz" \
              > "$ROOT/raw/daveml/examples/HL20_aero.dml" || ERRORS=$((ERRORS + 1))
          fi
          fetch_required 'https://www.daveml.org/DTDs/2p0p2/DAVEfunc.dtd' \
            "$ROOT/raw/daveml/schema/DAVEfunc-2.0.2.dtd"
          fetch_optional 'https://www.daveml.org/DTDs/2p0p2/DAVE-ML_ref.pdf' \
            "$ROOT/raw/daveml/schema/DAVE-ML-2.0.2-reference.pdf"

          SIMUPY_SHA='70754e6916afc206e8c0abb386d1a9c98bf8f561'
          SIMUPY_ZIP="$RUNNER_TEMP/simupy-flight.zip"
          fetch_required "https://codeload.github.com/nasa/simupy-flight/zip/$SIMUPY_SHA" "$SIMUPY_ZIP"
          if [[ -f "$SIMUPY_ZIP" ]]; then
            mkdir -p "$RUNNER_TEMP/simupy-flight"
            if unzip -q "$SIMUPY_ZIP" -d "$RUNNER_TEMP/simupy-flight"; then
              SRC="$RUNNER_TEMP/simupy-flight/simupy-flight-$SIMUPY_SHA"
              [[ -f "$SRC/README.rst" ]] && cp "$SRC/README.rst" "$ROOT/raw/nesc/pinned-simupy-flight/README.rst"
              LICENSE_FILE="$(find "$SRC" -maxdepth 1 -type f -iname 'license*' | head -n 1 || true)"
              [[ -n "$LICENSE_FILE" ]] && cp "$LICENSE_FILE" "$ROOT/raw/nesc/pinned-simupy-flight/$(basename "$LICENSE_FILE")"
              [[ -d "$SRC/nesc_test_cases" ]] && cp -R "$SRC/nesc_test_cases" "$ROOT/raw/nesc/pinned-simupy-flight/"
              find "$ROOT/raw/nesc/pinned-simupy-flight" -type d -name '__pycache__' -prune -exec rm -rf '{}' + || true
            else
              ERRORS=$((ERRORS + 1))
            fi
          fi

          cat > "$ROOT/reference/SOURCES.md" <<'EOF'
          # Sources

          ## NASA/NESC 2015 six-degree-of-freedom check cases

          - https://nescacademy.nasa.gov/flightsim/2015
          - official all-model archive
          - official initial-condition workbook
          - official atmospheric trajectory archive
          - official orbital trajectory archive

          ## DAVE-ML

          - https://www.daveml.org/examples/index.html
          - DAVEfunc 2.0.2 DTD and reference manual

          ## NASA simupy-flight snapshot

          - repository: https://github.com/nasa/simupy-flight
          - commit: 70754e6916afc206e8c0abb386d1a9c98bf8f561
          - selected paths: nesc_test_cases/, README.rst, license file
          EOF

          python - "$ROOT" <<'PY'
          from __future__ import annotations
          import csv
          import hashlib
          import sys
          from pathlib import Path
          from zipfile import BadZipFile, ZipFile

          root = Path(sys.argv[1])
          zip_report = []
          for archive in sorted((root / 'raw/nesc/official').glob('*.zip')):
              try:
                  with ZipFile(archive) as zf:
                      bad = zf.testzip()
                      zip_report.append((archive.relative_to(root).as_posix(), 'ok' if bad is None else f'bad:{bad}', len(zf.infolist())))
              except BadZipFile:
                  zip_report.append((archive.relative_to(root).as_posix(), 'invalid', 0))
          with (root / 'reference/zip-integrity.tsv').open('w', encoding='utf-8', newline='') as fh:
              writer = csv.writer(fh, delimiter='\t')
              writer.writerow(['path', 'status', 'member_count'])
              writer.writerows(zip_report)

          rows = []
          for path in sorted(p for p in root.rglob('*') if p.is_file()):
              rel = path.relative_to(root).as_posix()
              h = hashlib.sha256(path.read_bytes()).hexdigest()
              rows.append((rel, path.stat().st_size, h))
          with (root / 'reference/resource-files.tsv').open('w', encoding='utf-8', newline='') as fh:
              writer = csv.writer(fh, delimiter='\t')
              writer.writerow(['path', 'size_bytes', 'sha256'])
              writer.writerows(rows)
          with (root / 'checksums.sha256').open('w', encoding='utf-8') as fh:
              for rel, _, h in rows:
                  if rel != 'checksums.sha256':
                      fh.write(f'{h}  {rel}\n')
          PY

          printf '%s\n' "$ERRORS" > "$ROOT/reference/required-download-error-count.txt"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Upload resource artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taoryx-daveml-nesc-resources-v1.0
          path: ${{ env.ROOT }}
          if-no-files-found: error
          compression-level: 6
          retention-days: 1

      - name: Fail when required downloads failed
        if: always()
        shell: bash
        run: |
          count="$(cat "$ROOT/reference/required-download-error-count.txt" 2>/dev/null || echo 999)"
          echo "Required download errors: $count"
          test "$count" -eq 0
